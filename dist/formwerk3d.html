<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- KI-HINWEIS: Formwerk 3D ist ein vollständiger 3D-Editor in dieser einen Seite. Steuerung per JSON: Formwerk3D.run('[{"add":"box","w":2,"h":1,"d":1}]'), Gesamtanleitung: Formwerk3D.manual(), Bild der Ansicht: Formwerk3D.api.screenshot(). Ohne Seitenzugriff: Befehle im Modus „Export“ unter „Skript & Befehle“ einfügen und „Ausführen“. -->
<title>Formwerk 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="3D-Viewer und Editor mit CAD, Mesh-Bearbeitung, Sculpting, Textur-Studio, Rigging und Karten-Import – Export für C++, Unity und Unreal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e7e3da;--panel:#f6f3ec;--panel-2:#ebe7dd;--line:#d2ccbe;--fg:#26221b;--fg-dim:#6a6457;
  --accent:#b85c00;--accent-fg:#fff8ee;--accent-soft:rgba(184,92,0,.13);--ok:#2c7a4b;--danger:#b8321f;
  --vp-bg:#d8d4ca;--vp-grid-a:#b4ae9f;--vp-grid-b:#c6c1b4;--vp-wire:#3b362c;--vp-pt:#1d5fa8;--bone:#127a8a;--sel:#d97100;
  --pane-bg:#f1eee6;--pane-grid-a:#cbc5b6;--pane-grid-b:#e1dccf;--pane-text:#6a6457;--pane-fill:rgba(217,113,0,.15);--pane-hole:rgba(184,50,31,.18);
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(255,255,255,.5) inset,0 1px 2px rgba(40,30,10,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121418;--panel:#1b1e24;--panel-2:#242831;--line:#313640;--fg:#e9e6df;--fg-dim:#9b978d;
  --accent:#ffa630;--accent-fg:#1c1206;--accent-soft:rgba(255,166,48,.16);--ok:#5fcf8a;--danger:#ff7a68;
  --vp-bg:#1a1d23;--vp-grid-a:#3c424e;--vp-grid-b:#2a2f38;--vp-wire:#aeb7c6;--vp-pt:#6cb8ff;--bone:#4fd8c8;--sel:#ffa630;
  --pane-bg:#171a1f;--pane-grid-a:#363c47;--pane-grid-b:#252a32;--pane-text:#9b978d;--pane-fill:rgba(255,166,48,.17);--pane-hole:rgba(255,122,104,.22);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418;--panel:#1b1e24;--panel-2:#242831;--line:#313640;--fg:#e9e6df;--fg-dim:#9b978d;
  --accent:#ffa630;--accent-fg:#1c1206;--accent-soft:rgba(255,166,48,.16);--ok:#5fcf8a;--danger:#ff7a68;
  --vp-bg:#1a1d23;--vp-grid-a:#3c424e;--vp-grid-b:#2a2f38;--vp-wire:#aeb7c6;--vp-pt:#6cb8ff;--bone:#4fd8c8;--sel:#ffa630;
  --pane-bg:#171a1f;--pane-grid-a:#363c47;--pane-grid-b:#252a32;--pane-text:#9b978d;--pane-fill:rgba(255,166,48,.17);--pane-hole:rgba(255,122,104,.22);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font-ui);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;height:calc(100vh - 16px);height:calc(100dvh - 16px);min-height:560px}
/* Kopfzeile */
#top{display:flex;align-items:center;gap:12px;min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:15px;font-weight:600;letter-spacing:.01em}
.brand i{font-style:normal;font:11px var(--font-mono);color:var(--fg-dim)}
#modes{display:flex;gap:2px;padding:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
.mode{border:0;background:transparent;padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--fg-dim);font-weight:500}
.mode:hover{color:var(--fg)}
.mode[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
#top .sp{flex:1}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
#tools-top select{max-width:210px;min-width:0}
/* Schaltflächen */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;line-height:1.35}
.btn:hover{border-color:var(--fg-dim)}
.btn:disabled{opacity:.4;cursor:default}
.btn.on,.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.dng{color:var(--danger)}
.btn.sm{padding:2px 7px;font-size:12px}
.btn:focus-visible,.mode:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg .btn:last-child{border-radius:0 6px 6px 0}
/* Arbeitsfläche */
#work{display:grid;grid-template-columns:196px minmax(0,1fr) 296px;gap:8px;min-height:0}
body[data-mode="code"] #work,body[data-mode="map"] #work{grid-template-columns:196px minmax(0,1fr) minmax(320px,400px)}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0;overflow-y:auto;scrollbar-width:thin}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.sec{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px;min-width:0}
.sec:last-child{border-bottom:0}
.sec>h3{font:500 10.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.row>.grow{flex:1 1 0;min-width:0}
.fld{display:grid;grid-template-columns:minmax(64px,38%) minmax(0,1fr);align-items:center;gap:6px}
.fld>span{color:var(--fg-dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld.col{grid-template-columns:1fr}
input[type=number],input[type=text],select,textarea{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input[type=number]{font-family:var(--font-mono);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
input[type=color]{width:100%;height:26px;padding:1px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);margin:0}
textarea{font-family:var(--font-mono);font-size:11.5px;line-height:1.4;resize:vertical}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.hint{color:var(--fg-dim);font-size:12px;line-height:1.45}
.hint b{color:var(--fg);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.mono{font-family:var(--font-mono)}
.badge{font:10px var(--font-mono);color:var(--fg-dim);border:1px solid var(--line);border-radius:4px;padding:0 4px}
/* Objektliste */
#outliner{max-height:34vh;overflow-y:auto;padding:4px;scrollbar-width:thin}
.ol{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:5px;cursor:pointer;min-width:0}
.ol:hover{background:var(--panel-2)}
.ol.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.ol .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol .eye{border:0;background:transparent;cursor:pointer;color:var(--fg-dim);padding:0 3px;font-size:13px;line-height:1}
.ol .eye[aria-pressed="false"]{opacity:.35}
.empty{padding:10px;color:var(--fg-dim);font-size:12px}
.pal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:8px}
/* Bühne */
#stage{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:8px;min-height:0;min-width:0}
body.has-pane #stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#vpwrap{container:vp/inline-size;position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--vp-bg)}
#vp{position:absolute;inset:0;touch-action:none}
#vpwrap.drop{outline:2px dashed var(--accent);outline-offset:-6px}
#vpwrap.drop::after{content:'Datei hier loslassen';position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:color-mix(in srgb,var(--bg) 70%,transparent);font-weight:600;color:var(--accent);pointer-events:none}
#vp canvas{display:block;outline:none}
.ovl{position:absolute;display:flex;gap:6px;align-items:center;z-index:3;flex-wrap:wrap;pointer-events:none}
.ovl>*{pointer-events:auto}
.ovl .btn{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(4px)}
#ov-tl{left:8px;top:8px;max-width:calc(100% - 16px)}
#ov-bl{left:8px;bottom:8px}
#ov-br{right:8px;bottom:8px}
#stats{font:11px var(--font-mono);color:var(--fg-dim);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 7px;border-radius:5px}
#boxsel{position:absolute;border:1px dashed var(--sel);background:var(--accent-soft);z-index:4;pointer-events:none}
#vp-measure{position:absolute;z-index:4;transform:translate(-50%,-130%);background:var(--accent);color:var(--accent-fg);font:500 12px var(--font-mono);padding:1px 7px;border-radius:5px;pointer-events:none;white-space:nowrap}
#pane2d{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--pane-bg);display:flex;flex-direction:column}
#pane2d[hidden]{display:none}
#pane-bar{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
#pane-title{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);flex:1}
#pane-canvas{flex:1;min-height:0;width:100%;display:block}
/* Statuszeile & Meldungen */
#bottom{display:flex;gap:12px;align-items:center;min-width:0;font-size:12px;color:var(--fg-dim)}
#status-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status-msg[data-kind="err"]{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:min(92vw,560px);background:var(--fg);color:var(--bg);padding:7px 13px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;text-align:center}
#toast.show{opacity:.96;transform:translate(-50%,0)}
#toast[data-kind="err"]{background:var(--danger);color:#fff}
/* Hilfe */
#help{position:fixed;inset:0;z-index:40;background:rgba(10,10,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#help[hidden]{display:none}
#help .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
#help h2{font-size:16px;font-weight:600}
#help h3{font:500 10.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim);margin-top:4px}
#help kbd{font:11px var(--font-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#help .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px}
#help li{margin:2px 0}
#help ul{margin:0;padding-left:18px}
#loading{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--fg-dim)}
#loading[hidden]{display:none}
#loading b{font-size:20px;color:var(--fg);font-weight:600}
/* Zeitleiste & Listen */
.keys{display:flex;gap:4px;flex-wrap:wrap}
.key{font:11px var(--font-mono);padding:1px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer}
.key.on{border-color:var(--accent);background:var(--accent-soft)}
.tree{max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:2px;scrollbar-width:thin}
.tr{padding:1px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.tr:hover{background:var(--panel)}
.tr.sel{background:var(--accent);color:var(--accent-fg)}
.layer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;align-items:center;padding:3px 5px;border:1px solid transparent;border-radius:5px;cursor:pointer}
.layer.sel{border-color:var(--accent);background:var(--accent-soft)}
.layer .eye{border:0;background:transparent;cursor:pointer;padding:0 2px;color:var(--fg-dim)}
.layer .eye[aria-pressed="false"]{opacity:.35}
.code{white-space:pre;overflow:auto;max-height:260px}
a{color:var(--accent)}
/* schmale Bildschirme */
@media (max-width:900px){
  body{padding-block:6px}
  #app{height:auto;min-height:0;grid-template-rows:auto auto auto}
  #top{flex-wrap:wrap;gap:6px}
  #top .sp{display:none}
  #modes{order:3;flex:1 1 100%}
  #work,body[data-mode="code"] #work,body[data-mode="map"] #work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  #stage{height:68vh;min-height:360px;order:-1}
  body.has-pane #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);height:112vh}
  .side{overflow:visible}
  #outliner{max-height:200px}
  #bottom{position:sticky;bottom:0;background:var(--bg);padding:4px 0}
  .brand i{display:none}
  #tools-top{flex:1 1 100%}
  #tools-top select{flex:1 1 140px;width:auto;max-width:100%}
}
/* Fenster-Leisten: wenn die 3D-Ansicht schmal ist, in einer Zeile untereinander statt übereinander */
@container vp (max-width:790px){
  .ovl{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:calc(100% - 16px)}
  .ovl::-webkit-scrollbar{display:none}
  .ovl>*{flex:none}
  #ov-tl,#ov-tr{pointer-events:auto}
  #ov-tr{top:44px!important;left:8px;right:auto!important;justify-content:flex-start}
  #ov-bl{bottom:36px}
}
@media (max-width:1400px){.brand i{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

</head>
<body>
<div id="loading"><b>Formwerk 3D</b><span id="loading-msg">Lade 3D-Bibliothek …</span></div>
<div id="app">
  <header id="top">
    <div class="brand"><b>Formwerk 3D</b><i>CAD · Mesh · Sculpt · Textur · Rig · Karte</i></div>
    <nav id="modes" role="tablist" aria-label="Arbeitsmodus"></nav>
    <span class="sp"></span>
    <div class="tools" id="tools-top"></div>
  </header>
  <div id="work">
    <aside class="side" id="left">
      <div class="card"><div class="sec"><h3>Objekte</h3></div><div id="outliner"></div></div>
      <div class="card"><div class="sec"><h3>Neu</h3></div><div class="pal" id="palette"></div></div>
    </aside>
    <main id="stage">
      <div id="vpwrap">
        <div id="vp"></div>
        <div class="ovl" id="ov-tl"></div>
        <div class="ovl" id="ov-tr" style="right:8px;top:8px;justify-content:flex-end"></div>
        <div class="ovl" id="ov-bl"></div>
        <div class="ovl" id="ov-br"><span id="stats"></span></div>
        <div id="boxsel" hidden></div>
        <div id="vp-measure" hidden></div>
      </div>
      <div id="pane2d" hidden>
        <div id="pane-bar"><span id="pane-title"></span><button id="pane-close" class="btn sm" type="button">Schließen</button></div>
        <canvas id="pane-canvas"></canvas>
      </div>
    </main>
    <aside class="side" id="right">
      <div class="card" id="panel"></div>
      <div class="card" id="inspector"></div>
    </aside>
  </div>
  <footer id="bottom"><span id="status-msg">Bereit</span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="help" hidden></div>

<script>
(function () {
  var V = '0.147.0', CORE = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r147/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@' + V + '/build/three.min.js',
    'https://unpkg.com/three@' + V + '/build/three.min.js'
  ];
  var ADD = [['controls/OrbitControls.js', 1], ['controls/TransformControls.js', 1], ['exporters/GLTFExporter.js', 0], ['loaders/GLTFLoader.js', 0], ['loaders/OBJLoader.js', 0], ['loaders/STLLoader.js', 0], ['loaders/PLYLoader.js', 0], ['libs/fflate.min.js', 0], ['curves/NURBSUtils.js', 0], ['curves/NURBSCurve.js', 0], ['loaders/FBXLoader.js', 0], ['loaders/ColladaLoader.js', 0], ['loaders/TDSLoader.js', 0], ['loaders/3MFLoader.js', 0]];
  var msg = function (t) { var m = document.getElementById('loading-msg'); if (m) m.textContent = t; };
  function load(urls, done) {
    var i = 0;
    (function next() {
      if (i >= urls.length) return done(false);
      var s = document.createElement('script'); s.src = urls[i++]; s.async = false;
      s.onload = function () { done(true); }; s.onerror = function () { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  }
  function fail(t) { msg(t); var l = document.getElementById('loading'); if (l) l.hidden = false; }
  function start() {
// ---- 00-core.js ----
/* ============================================================
   Formwerk 3D – Kern: Helfer, Verlauf (Undo/Redo), Meldungen
   ============================================================ */
const F = (window.Formwerk = { version: '1.0', ticks: [] });
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const DEG = Math.PI / 180;
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d || 0); };
const fix = (n, d) => +(+n).toFixed(d === undefined ? 3 : d);
const smooth01 = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const uid = (() => { let i = 0; return () => ++i; })();

/* Minimaler DOM-Builder: h('div',{class:'x',onclick:fn},'Text',child) */
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) add(arguments[i]);
  function add(c) {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) c.forEach(add);
    else el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return el;
}

/* ---------- Meldungen ---------- */
F.say = function (msg, kind, quiet) {
  F.say.last = msg; const s = $('#status-msg'); if (s) { s.textContent = msg; s.dataset.kind = kind || ''; }
  const t = $('#toast');
  if (t && quiet) t.classList.remove('show');
  else if (t) {
    t.textContent = msg; t.dataset.kind = kind || ''; t.classList.add('show');
    clearTimeout(F.say._t); F.say._t = setTimeout(() => t.classList.remove('show'), kind === 'err' ? 5200 : 2200);
  }
  if (kind === 'err') console.warn('[Formwerk]', msg);
};

/* ---------- Verlauf (Rückgängig / Wiederholen) ---------- */
const H = F.history = {
  undo: [], redo: [], max: 80,
  push(label, undo, redo, free) {
    this.undo.push({ label, undo, redo, free });
    this.redo.forEach(e => e.free && e.free.clear && e.free.clear());
    this.redo.length = 0;
    while (this.undo.length > this.max) { const o = this.undo.shift(); o.free && o.free.evict && o.free.evict(); }
    F.ui && F.ui.refreshHistory && F.ui.refreshHistory();
  },
  back() {
    const e = this.undo.pop(); if (!e) return;
    try { e.undo(); } catch (err) { F.say('Rückgängig fehlgeschlagen: ' + err.message, 'err'); }
    this.redo.push(e); F.say('Rückgängig: ' + e.label); after();
  },
  forward() {
    const e = this.redo.pop(); if (!e) return;
    try { e.redo(); } catch (err) { F.say('Wiederholen fehlgeschlagen: ' + err.message, 'err'); }
    this.undo.push(e); F.say('Wiederholt: ' + e.label); after();
  },
  clear() { this.undo.length = 0; this.redo.length = 0; F.ui && F.ui.refreshHistory && F.ui.refreshHistory(); }
};
function after() {
  F.view && F.view.refreshAll && F.view.refreshAll();
  F.ui && F.ui.refreshHistory && F.ui.refreshHistory();
}

/* Datei- und Zwischenablage-Hilfen (in Chat-Sandboxes oft eingeschränkt) */
/* THREE.Color -> '#rrggbb'. getHexString() schneidet in r147 ab (1.0 wird 'fe'), hier wird gerundet. */
F.hex = function (c) {
  const lin = !!(window.THREE && THREE.ColorManagement && THREE.ColorManagement.legacyMode === false);
  const out = v => { if (lin) v = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; return Math.max(0, Math.min(255, Math.round(v * 255))).toString(16).padStart(2, '0'); };
  return '#' + out(c.r) + out(c.g) + out(c.b);
};
F.copyText = function (text, okMsg) {
  const done = () => F.say(okMsg || 'In die Zwischenablage kopiert');
  const fallback = () => {
    const ta = h('textarea', { style: { position: 'fixed', left: '-9999px', top: '0' } }); ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? done() : F.say('Kopieren nicht erlaubt – Text im Feld markieren und mit Strg+C kopieren', 'err'); }
    catch (e) { F.say('Kopieren nicht erlaubt – Text im Feld markieren und mit Strg+C kopieren', 'err'); }
    ta.remove();
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch (e) { fallback(); }
};
F.saveBlob = function (blob, name) {
  try {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    F.say('Download gestartet: ' + name + ' (falls nichts passiert: „Kopieren“ nutzen, Downloads sind in manchen Chat-Fenstern gesperrt)');
  } catch (e) { F.say('Download nicht möglich – bitte „Kopieren“ nutzen', 'err'); }
};

/* ============================================================
   CAD-Booleans (Vereinigung / Differenz / Schnitt) per BSP-Baum
   ============================================================ */

  const EPS = 1e-5;

   Geometrie-Werkzeuge: Weld, Unterteilen, Glätten, Spiegeln, Array,
   Hohlkörper, Deformer, UV-Projektionen, Zusammenführen

const P2 = F.pane = { editor: null, w: 10, h: 10, dpr: 1 };

  P2.host = host; P2.canvas = canvas; P2.ctx = canvas.getContext('2d');
  const fit = () => {

    const r = canvas.getBoundingClientRect(); P2.w = Math.max(10, r.width); P2.h = Math.max(10, r.height);

  new ResizeObserver(fit).observe(canvas); P2.fit = fit;
  const loc = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, e }; };
  canvas.style.touchAction = 'none';
  canvas.addEventListener('pointerdown', e => { if (!P2.editor || !P2.editor.down) return; canvas.setPointerCapture(e.pointerId); P2.editor.down(loc(e)); });
  canvas.addEventListener('pointermove', e => { if (P2.editor && P2.editor.move) P2.editor.move(loc(e)); });
  canvas.addEventListener('pointerup', e => { if (P2.editor && P2.editor.up) P2.editor.up(loc(e)); });
  canvas.addEventListener('pointercancel', e => { if (P2.editor && P2.editor.up) P2.editor.up(loc(e)); });
  canvas.addEventListener('dblclick', e => { if (P2.editor && P2.editor.dbl) P2.editor.dbl(loc(e)); });
  canvas.addEventListener('wheel', e => { if (P2.editor && P2.editor.wheel) { e.preventDefault(); P2.editor.wheel(loc(e), e.deltaY); } }, { passive: false });

const SK = F.sketch = {

  for (let x = Math.floor(x0 / step) * step; x <= x1; x += step) { const major = Math.abs(Math.round(x) - x) < 1e-6; c.strokeStyle = major ? css('--pane-grid-a') : css('--pane-grid-b'); c.beginPath(); c.moveTo(Math.round(sx(x)) + 0.5, 0); c.lineTo(Math.round(sx(x)) + 0.5, h); c.stroke(); }
  for (let y = Math.floor(y0 / step) * step; y <= y1; y += step) { const major = Math.abs(Math.round(y) - y) < 1e-6; c.strokeStyle = major ? css('--pane-grid-a') : css('--pane-grid-b'); c.beginPath(); c.moveTo(0, Math.round(sy(y)) + 0.5); c.lineTo(w, Math.round(sy(y)) + 0.5); c.stroke(); }

  c.fillStyle = css('--pane-text'); c.font = '11px ' + css('--font-mono'); c.fillText('1 m = ' + Math.round(s) + ' px   Raster ' + (SK.snap || 'frei') + ' m', 10, h - 10);

    c.beginPath(); lp.pts.forEach((p, i) => i ? c.lineTo(sx(p[0]), sy(p[1])) : c.moveTo(sx(p[0]), sy(p[1])));
    if (lp.closed) { c.closePath(); c.fillStyle = lp.hole ? css('--pane-hole') : css('--pane-fill'); c.fill(); }
    c.lineWidth = li === SK.cur ? 2 : 1.4; c.strokeStyle = lp.hole ? css('--danger') : css('--sel'); c.stroke();
    lp.pts.forEach((p, i) => { const on = SK.sel && SK.sel[0] === li && SK.sel[1] === i; c.fillStyle = on ? '#fff' : (lp.hole ? css('--danger') : css('--sel')); c.fillRect(sx(p[0]) - 4, sy(p[1]) - 4, 8, 8); if (on) { c.strokeStyle = css('--sel'); c.strokeRect(sx(p[0]) - 5, sy(p[1]) - 5, 10, 10); } });
  });
  if (SK.sel) { const p = SK.loops[SK.sel[0]].pts[SK.sel[1]]; if (p) { c.fillStyle = css('--pane-text'); c.fillText('x ' + fix(p[0], 3) + '  y ' + fix(p[1], 3), 10, 18); } }

SK.hit = function (px, py) {

X.importText = async function (text, name, ext) {
  const t = text.trim();
  if (t[0] === '{' || t[0] === '[') {
    let j = null; try { j = JSON.parse(t); } catch (e) { /* evtl. mit Rahmentext */ }
    if (j && j.app === 'Formwerk3D') { X.deserialize(j); return 'szene'; }
    if (j && j.asset && j.asset.version) { await X.importGLTF(t, name || 'glTF'); return 'gltf'; }
    F.map.parse(t); F.map.build({}); return 'karte';

  if (/^\s*(solid|facet)\b/.test(t) && /facet\s+normal/.test(t)) { X.importSTL(t, name); return 'stl'; }

/* JSON-Befehle (ein Objekt oder ein Array) */
F.cmd = function (list) {
  const api = F.api; if (!Array.isArray(list)) list = [list]; let n = 0;
  list.forEach((c, i) => {
    try {
      if (c.add) api.add(c.add, c);
      else if (c.boolean) api.subtract && F.boolean(c.boolean, api.find(c.a), api.find(c.b), !!c.keep, c.name);
      else if (c.set) { const m = api.find(c.set); api.place(m, c); V.refreshAll(); }
      else if (c.delete) api.remove(c.delete);
      else if (c.extrude) api.extrude(c.extrude.points, c.extrude.depth, c.extrude);
      else if (c.lathe) api.lathe(c.lathe.points, c.lathe.segments, c.lathe);
      else if (c.map) api.map(c.map);
      else if (c.mirror) api.mirror(c.mirror, c.axis, c.cut);
      else if (c.array) api.array(c.array, c.count, c.offset);
      else if (c.shell) api.shell(c.shell, c.thickness);
      else if (c.subdivide) api.subdivide(c.subdivide, c.kind);
      else if (c.smooth) api.smooth(c.smooth, c.iterations, c.lambda);
      else if (c.decimate) api.decimate(c.decimate, c.ratio);
      else if (c.deform) api.deform(c.deform, c.kind, c.amount);
      else if (c.merge) api.merge(c.merge, c.name);
      else if (c.scene) api.scene(c.scene);
      else if (c.photo) { const q = c.photo; Promise.resolve().then(async () => { if (q.simulate) await api.photo.simulate(q.simulate === true ? 24 : q.simulate, q.elev, q.f35); if (q.build) await api.photo.build(q.options); }).catch(e => F.say(e.message, 'err')); }
      else if (c.clear) api.clear();
      else if (c.view) api.view(c.view);
      else if (c.mode) UI.setMode(c.mode);
      else if (c.export) { exp.fmt = c.export; UI.setMode('code'); UI.genExport(); }
      else throw new Error('Unbekannter Befehl');
      n++;
    } catch (e) { throw new Error('Befehl ' + (i + 1) + ': ' + e.message); }
  });
  V.frame(); return n;
};
F.run = function (src) {
  src = String(src || '').trim().replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim(); if (!src) return F.say('Nichts zum Ausführen', 'err');
  try {
    F.group('Skript', () => {
      if (src[0] === '[' || src[0] === '{') { let j = null; try { j = JSON.parse(src); } catch (e) { j = null; } if (j) { const n = F.cmd(j); F.say(n + ' Befehl' + (n === 1 ? '' : 'e') + ' ausgeführt'); return; } }
      let fn; try { fn = new Function(...Object.keys(F.api), src); } catch (e) { throw new Error(e instanceof EvalError || /unsafe-eval|Content Security|blocked/i.test(e.message) ? 'Skripte sind in diesem Fenster gesperrt – bitte JSON-Befehle verwenden' : 'Syntaxfehler: ' + e.message); }
      fn(...Object.values(F.api)); V.frame(); F.say('Skript ausgeführt');
    });
  } catch (e) { F.say(e.message, 'err'); }
};

UI.keys = function () {
  window.addEventListener('keydown', e => {
    const t = e.target, tag = t && t.tagName; if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (t && t.isContentEditable)) return;
    const k = e.key, ctrl = e.ctrlKey || e.metaKey, lk = k.length === 1 ? k.toLowerCase() : k;
    if (k === 'Escape') { if (!$('#help').hidden) { UI.help(false); return; } if (S.mode === 'sculpt' || S.mode === 'edit') { UI.setMode('object'); return; } V.select(null); return; }
    if (ctrl && lk === 'z') { e.preventDefault(); e.shiftKey ? UI.redo() : UI.undo(); return; }
    if (ctrl && lk === 'y') { e.preventDefault(); UI.redo(); return; }
    if (ctrl && lk === 'd') { e.preventDefault(); if (V.objMode()) V.duplicate(); return; }
    if (ctrl) { if (lk === '1') { e.preventDefault(); V.viewDir('back'); } else if (lk === '3') { e.preventDefault(); V.viewDir('left'); } else if (lk === '7') { e.preventDefault(); V.viewDir('bottom'); } return; }
    if (k === 'Tab') { e.preventDefault(); UI.setMode(S.mode === 'edit' ? 'object' : 'edit'); return; }
    if (lk === 'g' || lk === 'r' || lk === 's') { if (V.objMode() || S.mode === 'rig') { if (S.mode === 'rig') { RG_.gizmo = lk === 'g' ? 'translate' : 'rotate'; RG_.attachGizmo(); } else V.setGizmo(lk === 'g' ? 'translate' : lk === 'r' ? 'rotate' : 'scale'); } return; }
    if (k === 'Delete' || k === 'Backspace' || lk === 'x') { if (V.objMode()) V.remove(); else if (S.mode === 'rig' && RG_.sel) RG_.remove(RG_.sel); return; }
    if (lk === 'f') { if (S.mode === 'rig' && RG_.sel) { V.frame(); } else V.focusSel(); return; }
    if (k === 'Home') { V.frame(); return; }

    else if (k === ' ' && S.mode === 'rig') { e.preventDefault(); RG_.play(); UI.drawPanel(true); }
    else if (lk === 'k' && S.mode === 'rig') RG_.setKey(RG_.time);
  });
};
