<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Dortmund Kachel-Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#aec3d4;overflow:hidden;font:13px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:8px;top:8px;background:rgba(10,18,28,.8);color:#e8eef5;padding:8px 10px;border-radius:6px;white-space:pre;line-height:1.4;font:12px ui-monospace,Consolas,monospace;pointer-events:none;max-width:calc(100vw - 32px)}
#help{position:fixed;left:8px;bottom:8px;background:rgba(10,18,28,.7);color:#cfd9e4;padding:6px 9px;border-radius:6px;font-size:12px;max-width:calc(100vw - 32px)}
#help button{font:inherit;margin-left:6px;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas><div id="hud">lade …</div>
<div id="help">Ziehen = umsehen · W A S D = fliegen · Q/E = hoch/runter · Umschalt = schnell · Mausrad = Tempo <button id="tour">Rundflug</button><br>Daten: LoD2 + DGM1 NRW, Datenlizenz Deutschland – Zero – Version 2.0 (laut Datensatz)</div>
<script src="three.min.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search), DEBUG = q.has('debug'), BASE = q.get('base') || 'tiles/';
  const M = await (await fetch(BASE + 'manifest.json')).json();
  const NX = M.grid[0], NZ = M.grid[1], CS = M.cell, HMIN = M.hmin, HSC = M.hsc;
  const TH = [450, 1100, 2400, 3200];                  // Radius je Stufe L0..L3 (letzter = Ladefenster)
  if (q.get('th')) q.get('th').split(',').forEach((v, i) => TH[i] = +v);
  const CONC = +(q.get('conc') || 6);
  const canvas = document.getElementById('c'), hud = document.getElementById('hud');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xaec3d4); scene.fog = new THREE.Fog(0xaec3d4, TH[3] * 0.62, TH[3] * 1.02);
  const cam = new THREE.PerspectiveCamera(60, 1, 1, 9000);
  scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x6b6a5e, 0.55));
  const sun = new THREE.DirectionalLight(0xfff1d8, 0.95); sun.position.set(-0.5, 0.85, 0.45); scene.add(sun);
  const matCache = {};
  const matT = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 });
  const matC = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, flatShading: true });
  const matB = new THREE.MeshStandardMaterial({ color: 0xb4ada3, roughness: 0.92, metalness: 0, flatShading: true, side: THREE.DoubleSide });
  const TINT = [[1, 1, 1], [0.85, 1, 0.85], [1, 0.9, 0.7], [0.8, 0.85, 1]];
  const S = { bytes: 0, fetches: 0, loads: 0, unloads: 0, swaps: 0, inflight: 0, firstTile: null, firstFrame: null, t0: performance.now(), frames: 0, ft: 16, maxTris: 0 };
  const tiles = new Map();            // key -> {cx,cz,level,group,tris,want,loading}
  const queue = [];
  const key = (cx, cz) => cx + '_' + cz;
  const ramp = (y, out, o, ti) => {
    let t = Math.min(1, Math.max(0, (y + 25) / 55)); const lo = [0.30, 0.46, 0.25], hi = [0.74, 0.70, 0.52];
    for (let k = 0; k < 3; k++) out[o + k] = (lo[k] + (hi[k] - lo[k]) * t) * (DEBUG ? TINT[ti][k] : 1);
  };
  async function get(name) {
    const r = await fetch(BASE + name); if (!r.ok) throw new Error(name + ' ' + r.status);
    const b = await r.arrayBuffer(); S.bytes += b.byteLength; S.fetches++; return b;
  }
  function heightMesh(L, cx, cz, buf) {
    const info = M.levels[L], n = info.n, res = info.res, city = info.kind === 'city';
    const hq = new Uint16Array(buf, 0, n * n), fl = city ? new Uint8Array(buf, n * n * 2, n * n) : null;
    const nv = n * n, ns = 4 * n, pos = new Float32Array((nv + ns) * 3), col = new Float32Array((nv + ns) * 3), nor = new Float32Array((nv + ns) * 3);
    const H = (i, j) => HMIN + hq[Math.min(n - 1, Math.max(0, i)) * n + Math.min(n - 1, Math.max(0, j))] / HSC;
    const x0 = cx * CS, z0 = -cz * CS;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = i * n + j, y = H(i, j); pos[v * 3] = x0 + j * res; pos[v * 3 + 1] = y; pos[v * 3 + 2] = z0 - i * res;
      if (fl && fl[v]) { for (let k = 0; k < 3; k++) col[v * 3 + k] = [0.66, 0.62, 0.58][k] * (DEBUG ? TINT[L][k] : 1); }
      else ramp(y, col, v * 3, L);
      let nx = -(H(i, j + 1) - H(i, j - 1)) / (2 * res), nz = (H(i + 1, j) - H(i - 1, j)) / (2 * res), nl = Math.hypot(nx, 1, nz);
      nor[v * 3] = nx / nl; nor[v * 3 + 1] = 1 / nl; nor[v * 3 + 2] = nz / nl;
    }
    const ind = new Uint32Array(((n - 1) * (n - 1) * 2 + 4 * (n - 1) * 2) * 3); let p = 0;
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < n - 1; j++) {
      const a = i * n + j, b = a + 1, c = a + n, d = c + 1;
      ind[p++] = a; ind[p++] = b; ind[p++] = c; ind[p++] = b; ind[p++] = d; ind[p++] = c;
    }
    // Schürzen an den vier Rändern gegen Risse zwischen verschiedenen Stufen
    const depth = city ? Math.max(6, res * 0.9) : 2.5 + res * 0.3; let s = nv;
    const edges = [[0, 0, 0, 1], [n - 1, 0, 0, 1], [0, 0, 1, 0], [0, n - 1, 1, 0]];
    for (let e = 0; e < 4; e++) {
      const first = s, [i0, j0, di, dj] = edges[e];
      for (let k = 0; k < n; k++) {
        const i = i0 + di * k, j = j0 + dj * k, v = i * n + j;
        pos[s * 3] = pos[v * 3]; pos[s * 3 + 1] = pos[v * 3 + 1] - depth; pos[s * 3 + 2] = pos[v * 3 + 2];
        col[s * 3] = col[v * 3]; col[s * 3 + 1] = col[v * 3 + 1]; col[s * 3 + 2] = col[v * 3 + 2]; nor[s * 3 + 1] = 1; s++;
      }
      for (let k = 0; k < n - 1; k++) {
        const v1 = (i0 + di * k) * n + j0 + dj * k, v2 = (i0 + di * (k + 1)) * n + j0 + dj * (k + 1), s1 = first + k, s2 = first + k + 1;
        ind[p++] = v1; ind[p++] = s1; ind[p++] = v2; ind[p++] = v2; ind[p++] = s1; ind[p++] = s2;
        ind[p++] = v1; ind[p++] = v2; ind[p++] = s1; ind[p++] = v2; ind[p++] = s2; ind[p++] = s1;   // beidseitig sichtbar
      }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setIndex(new THREE.BufferAttribute(ind.subarray(0, p), 1));
    const m = new THREE.Mesh(g, city ? matC : matT); m.frustumCulled = true; g.computeBoundingSphere();
    return { mesh: m, tris: p / 3 };
  }
  function buildingMesh(L, buf) {
    const hd = new Uint32Array(buf, 0, 4), nv = hd[0], nt = hd[1], i16 = hd[2], bb = new Float32Array(buf, 16, 6);
    const qp = new Uint16Array(buf, 40, nv * 3), pos = new Float32Array(nv * 3);
    const sx = (bb[3] - bb[0]) / 65535, sy = (bb[4] - bb[1]) / 65535, sz = (bb[5] - bb[2]) / 65535;
    for (let v = 0; v < nv; v++) { pos[v * 3] = bb[0] + qp[v * 3] * sx; pos[v * 3 + 1] = bb[1] + qp[v * 3 + 1] * sy; pos[v * 3 + 2] = bb[2] + qp[v * 3 + 2] * sz; }
    const off = 40 + nv * 6 + ((4 - (nv * 6) % 4) % 4), idx = i16 ? new Uint16Array(buf, off, nt * 3) : new Uint32Array(buf, off, nt * 3);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(new THREE.BufferAttribute(idx, 1)); g.computeBoundingSphere();
    let mat = matB; if (DEBUG) { mat = matCache['b' + L] = matCache['b' + L] || new THREE.MeshStandardMaterial({ color: new THREE.Color(0.68 * TINT[L][0], 0.66 * TINT[L][1], 0.62 * TINT[L][2]), roughness: .92, flatShading: true, side: THREE.DoubleSide }); }
    return { mesh: new THREE.Mesh(g, mat), tris: nt };
  }
  async function loadLevel(cx, cz, L) {
    const grp = new THREE.Group(); let tris = 0, ent = M.tiles[key(cx, cz)] || {};
    const jobs = [get('h' + L + '_' + cx + '_' + cz + '.bin')];
    const hasB = L <= 1 && ent['b' + L]; if (hasB) jobs.push(get('b' + L + '_' + cx + '_' + cz + '.bin'));
    const [hb, bb] = await Promise.all(jobs);
    const h = heightMesh(L, cx, cz, hb); grp.add(h.mesh); tris += h.tris;
    if (bb) { const b = buildingMesh(L, bb); grp.add(b.mesh); tris += b.tris; }
    return { grp, tris };
  }
  function dispose(grp) { grp.traverse(o => { if (o.geometry) o.geometry.dispose(); }); scene.remove(grp); }
  function pump() {
    while (S.inflight < CONC && queue.length) {
      const j = queue.shift(), t = tiles.get(j.key);
      if (!t || t.want !== j.level || t.loading !== j.level) continue;
      S.inflight++;
      loadLevel(t.cx, t.cz, j.level).then(r => {
        S.inflight--;
        if (t.want !== j.level) { dispose(r.grp); }
        else {
          if (t.group) dispose(t.group);
          scene.add(r.grp); if (!t.group) S.loads++; else S.swaps++; t.group = r.grp; t.tris = r.tris; t.level = j.level; t.loading = -2;
          if (S.firstTile === null) S.firstTile = performance.now() - S.t0;
        }
        pump();
      }).catch(e => { S.inflight--; t.loading = -2; console.error('Kachel', j.key, e.message); pump(); });
    }
  }
  function updateLOD() {
    const cp = cam.position;
    for (let cz = 0; cz < NZ; cz++) for (let cx = 0; cx < NX; cx++) {
      const k = key(cx, cz), x0 = cx * CS, z0 = -(cz + 1) * CS;
      const dx = Math.max(x0 - cp.x, 0, cp.x - (x0 + CS)), dz = Math.max(z0 - cp.z, 0, cp.z - (z0 + CS)), dy = Math.max(0, cp.y - 25);
      const d = Math.hypot(dx, dz, dy);
      let t = tiles.get(k); if (!t) { t = { cx, cz, level: -1, group: null, tris: 0, want: -1, loading: -2 }; tiles.set(k, t); }
      let want = -1; for (let l = 0; l < 4; l++) { const lim = TH[l] * (t.want === l ? 1.08 : 1); if (d < lim) { want = l; break; } }
      if (want === t.want) continue;
      t.want = want;
      if (want < 0) { if (t.group) { dispose(t.group); t.group = null; t.tris = 0; t.level = -1; S.unloads++; } t.loading = -2; continue; }
      if (t.level === want) { t.loading = -2; continue; }
      t.loading = want; const j = { key: k, level: want, d }; queue.push(j);
    }
    queue.sort((a, b) => a.d - b.d); pump();
  }
  // ---- Kamera / Steuerung
  let yaw = 0, pitch = -0.35, speed = 120; const keys = {};
  const cs = (q.get('cam') || '1500,260,-2400,0.3,-0.4').split(',').map(Number); cam.position.set(cs[0], cs[1], cs[2]); yaw = cs[3]; pitch = cs[4];
  function setDir() { cam.rotation.order = 'YXZ'; cam.rotation.set(pitch, yaw, 0); }
  addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
  let drag = false; canvas.addEventListener('pointerdown', e => { drag = true; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', () => drag = false);
  canvas.addEventListener('pointermove', e => { if (drag) { yaw -= e.movementX * 0.004; pitch = Math.max(-1.55, Math.min(1.55, pitch - e.movementY * 0.004)); } });
  canvas.addEventListener('wheel', e => { speed = Math.max(10, Math.min(2000, speed * (e.deltaY < 0 ? 1.2 : 1 / 1.2))); e.preventDefault(); }, { passive: false });
  let tour = false, tourT = 0;
  document.getElementById('tour').onclick = () => { tour = !tour; tourT = 0; };
  const WP = [[400, 420, -500], [1500, 160, -900], [2300, 90, -1900], [1500, 80, -2700], [600, 220, -3600], [1500, 700, -2000], [1500, 160, -2400]];
  function tourStep(dt) {
    tourT += dt * speed / 600; const n = WP.length - 1, f = Math.min(n - 1e-6, tourT), i = Math.floor(f), u = f - i, a = WP[i], b = WP[i + 1];
    cam.position.set(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u);
    const dx = b[0] - a[0], dz = b[2] - a[2]; yaw = Math.atan2(-dx, -dz); pitch = Math.atan2(b[1] - a[1], Math.hypot(dx, dz)) - 0.15; if (tourT > n) tour = false;
  }
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  // ---- Schleife
  let last = performance.now(), lodT = 0, hudT = 0;
  function frame(now) {
    const last0 = now - last, dt = Math.min(0.1, last0 / 1000); last = now; S.ft = S.ft * 0.9 + last0 * 0.1;
    if (tour) tourStep(dt); else {
      const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0), s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), u = (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0);
      const v = speed * (keys.ShiftLeft || keys.ShiftRight ? 4 : 1) * dt;
      if (f || s || u) { cam.position.x += (-Math.sin(yaw) * Math.cos(pitch) * f + Math.cos(yaw) * s) * v; cam.position.y += (Math.sin(pitch) * f + u) * v; cam.position.z += (-Math.cos(yaw) * Math.cos(pitch) * f - Math.sin(yaw) * s) * v; }
    }
    setDir();
    if (now - lodT > 120) { lodT = now; updateLOD(); }
    renderer.render(scene, cam); S.frames++;
    if (S.firstTile !== null && S.firstFrame === null) S.firstFrame = performance.now() - S.t0;
    S.maxTris = Math.max(S.maxTris, renderer.info.render.triangles);
    if (now - hudT > 250) { hudT = now; hud.textContent = text(); }
    requestAnimationFrame(frame);
  }
  function stats() {
    const lv = [0, 0, 0, 0]; let tris = 0, res = 0; tiles.forEach(t => { if (t.group) { lv[t.level]++; res++; tris += t.tris; } });
    return { levels: lv, resident: res, tris, bytes: S.bytes, fetches: S.fetches, loads: S.loads, swaps: S.swaps, unloads: S.unloads, inflight: S.inflight, queued: queue.length,
      renderedTris: renderer.info.render.triangles, calls: renderer.info.render.calls, frameMs: S.ft, firstTileMs: S.firstTile, firstFrameMs: S.firstFrame, frames: S.frames,
      heapMB: performance.memory ? performance.memory.usedJSHeapSize / 1048576 : null, cam: [cam.position.x, cam.position.y, cam.position.z, yaw, pitch] };
  }
  function text() {
    const s = stats();
    return 'Kacheln im Speicher: ' + s.resident + ' von ' + NX * NZ + '   (L0 ' + s.levels[0] + ' · L1 ' + s.levels[1] + ' · L2 ' + s.levels[2] + ' · L3 ' + s.levels[3] + ')\n' +
      'Dreiecke gezeichnet: ' + s.renderedTris.toLocaleString('de-DE') + '   Aufrufe: ' + s.calls + '\n' +
      'Geladen: ' + (s.bytes / 1048576).toFixed(2) + ' MB in ' + s.fetches + ' Dateien   (geladen ' + s.loads + ' · getauscht ' + s.swaps + ' · entladen ' + s.unloads + ')\n' +
      'Wartend: ' + (s.inflight + s.queued) + '   Bild: ' + s.frameMs.toFixed(0) + ' ms   Position: ' + cam.position.x.toFixed(0) + ' / ' + cam.position.y.toFixed(0) + ' / ' + cam.position.z.toFixed(0);
  }
  window.__v = {
    stats, setCam(x, y, z, yw, pt) { cam.position.set(x, y, z); yaw = yw; pitch = pt; setDir(); updateLOD(); },
    settled() { return S.inflight === 0 && queue.length === 0 && [...tiles.values()].every(t => t.loading === -2); },
    updateLOD, M,
  };
  window.__ready = true; requestAnimationFrame(frame);
})().catch(e => { document.getElementById('hud').textContent = 'Fehler: ' + e.message; console.error(e); });
</script></body></html>
