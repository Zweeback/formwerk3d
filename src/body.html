<div id="loading"><b>Formwerk 3D</b><span id="loading-msg">Lade 3D-Bibliothek …</span></div>
<div id="app">
  <header id="top">
    <div class="brand"><b>Formwerk 3D</b><i>CAD · Mesh · Sculpt · Textur · Rig · Karte</i></div>
    <nav id="modes" role="tablist" aria-label="Arbeitsmodus"></nav>
    <span class="sp"></span>
    <div class="tools" id="tools-top"></div>
  </header>
  <div id="work">
    <aside class="side" id="left">
      <div class="card"><div class="sec"><h3>Objekte</h3></div><div id="outliner"></div></div>
      <div class="card"><div class="sec"><h3>Neu</h3></div><div class="pal" id="palette"></div></div>
    </aside>
    <main id="stage">
      <div id="vpwrap">
        <div id="vp"></div>
        <div class="ovl" id="ov-tl"></div>
        <div class="ovl" id="ov-tr" style="right:8px;top:8px;justify-content:flex-end"></div>
        <div class="ovl" id="ov-bl"></div>
        <div class="ovl" id="ov-br"><span id="stats"></span></div>
        <div id="boxsel" hidden></div>
        <div id="vp-measure" hidden></div>
      </div>
      <div id="pane2d" hidden>
        <div id="pane-bar"><span id="pane-title"></span><button id="pane-close" class="btn sm" type="button">Schließen</button></div>
        <canvas id="pane-canvas"></canvas>
      </div>
    </main>
    <aside class="side" id="right">
      <div class="card" id="panel"></div>
      <div class="card" id="inspector"></div>
    </aside>
  </div>
  <footer id="bottom"><span id="status-msg">Bereit</span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="help" hidden></div>
